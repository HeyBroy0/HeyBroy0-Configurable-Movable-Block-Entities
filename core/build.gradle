plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = 'movable-block-entities-core'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
