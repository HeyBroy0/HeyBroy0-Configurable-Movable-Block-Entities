plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "movable_block_entities" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Fabric Loader supplies MixinExtras at runtime. This dependency exposes
    // its WrapOperation API to the compiler without embedding a second copy.
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.5"

    // FrozenLib owns block-entity snapshot/restoration during piston movement.
    implementation "maven.modrinth:9KawNmQc:W1wrCkKg"

    implementation project(":core")
    include project(":core")
}

// Capture the value during configuration to remain compatible with
// Gradle configuration caching.
def configuredModVersion = providers.gradleProperty("mod_version").get()
tasks.named("processResources") {
    inputs.property "version", configuredModVersion
    filesMatching("fabric.mod.json") {
        expand "version": configuredModVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
