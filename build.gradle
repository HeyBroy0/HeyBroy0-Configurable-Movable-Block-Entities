plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric Loom supplies the Minecraft and Fabric repositories required here.
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "movable_block_entities" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(":core")
    include project(":core")
}

// Capture the version during configuration so the task closure remains compatible
// with Gradle's configuration cache.
def configuredModVersion = providers.gradleProperty("mod_version").get()
tasks.named("processResources") {
    inputs.property "version", configuredModVersion
    filesMatching("fabric.mod.json") {
        expand "version": configuredModVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
